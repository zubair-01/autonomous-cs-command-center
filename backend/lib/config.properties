[DEFAULT]
app_name = Autonomous CS Command Center
environment = development

[DATABASE]
db_host = localhost
db_port = 5433
db_name = cs_command_center
db_user = postgres
db_password = postgres

[KAFKA]
bootstrap_servers = localhost:9092
ticket_topic = ticket.incoming
consumer_group = cs_agent_group

[REDIS]
redis_host = localhost
redis_port = 6379

[LOGGING]
log_level = INFO
log_file_path = log/app.log

[AI]
provider = gemini
llm_model = gemini-3.1-flash-lite
embedding_model = gemini-embedding-001
google_api_key = YOUR_GEMINI_API_KEY_HERE