services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database with pgvector extension
  #    Stores relational customer/ticket data AND vector embeddings for RAG.
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cs_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cs_command_center
    ports:
      - "5433:5432"  # Mapped host port 5433 to container port 5432 to avoid host conflicts
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cs_command_center"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Apache Kafka & Zookeeper (Event Streaming Engine)
  #    Enables asynchronous event-driven ticket ingestion.
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cs_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cs_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ---------------------------------------------------------------------------
  # 3. Redis (Cache & WebSocket Pub/Sub Engine)
  #    Bridges background AI worker telemetry to real-time WebSockets.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cs_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
